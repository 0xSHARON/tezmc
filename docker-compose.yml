version: '3.8'
name: tezmc

services:
  tezmc-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tezmc-core
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "3007:3007"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:/app/data/autoplay.sqlite
      - CAPTURE_SOURCE_TYPE=test_pattern
    volumes:
      - autoplay_data:/app/data
      - autoplay_logs:/app/logs
    labels:
      - "com.tezmc.description=TEZMC Autonomous Gaming & Live Streaming Core"

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tezmc-dashboard
    restart: unless-stopped
    ports:
      - "5173:5173"
    command: ["pnpm", "--filter", "@autoplay/dashboard", "run", "dev", "--host"]
    depends_on:
      - tezmc-core
    labels:
      - "com.tezmc.description=TEZMC Gaming Operations Dashboard"

volumes:
  # Preserved volume names for seamless data continuity
  autoplay_data:
  autoplay_logs:
